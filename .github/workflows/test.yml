# Full test run on every pull request to main: unit and component tests of every package and app,
# the deploy tests, and the API contract against the vendored openapi.json.
name: Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit, component and deploy tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Bun (1.3, the line of the web image)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.x"

      - name: Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install the workspace (frozen lockfile)
        run: bun install --frozen-lockfile

      # One `bun run test` per package and app: each script passes the workspace preload itself
      # (a bare `bun test` would miss it).
      - name: Unit and component tests (every package and app)
        run: |
          set -eu
          for manifest in apps/*/package.json packages/*/package.json; do
            dir="$(dirname "$manifest")"
            if jq -e '.scripts.test' "$manifest" > /dev/null; then
              echo "::group::test $dir"
              (cd "$dir" && bun run test)
              echo "::endgroup::"
            fi
          done

      # The render tests run the real entrypoint with envsubst (gettext-base); without it they skip.
      - name: Deploy tests (render the nginx config with the real entrypoint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext-base shellcheck
          shellcheck --shell=sh deploy/entrypoint.sh
          bun test deploy

  contract:
    name: API contract is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Bun (1.3, the line of the web image)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.x"

      - name: Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install the workspace (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Regenerate the typed client and the contract check from packages/api/openapi.json
        run: |
          bun run gen:api
          bun run gen:contract

      # The committed generated files must be exactly what the vendored schema produces.
      - name: Fail when the committed generated files are stale
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- packages/api)"

      - name: Contract check (typecheck of the client against the schema)
        run: bun run contract:check

      - name: Typecheck the e2e project
        run: bun run e2e:typecheck

  secrets-scan:
    name: Secrets in the change (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for the diff base)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan the commits of the pull request
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown --fail
