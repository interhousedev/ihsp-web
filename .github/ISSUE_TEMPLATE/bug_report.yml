name: Bug report
description: Something in one of the web apps does not work as expected.
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options: [id, sp (my.iht), staff, admin, lms, share, library, landing, packages, deploy]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. Do not paste personal data of students or staff.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, device and language
      placeholder: Chrome 140 on Android, Telegram mini app, ru
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the app settings, or the image tag.
