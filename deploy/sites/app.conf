# Installable PWA: the same static build as the student portal (/srv/sp), served on its own host
# with its own runtime config (APP_MODE "pwa", OAUTH_CLIENT_ID "app").
# Every location that sets Cache-Control re-includes the security headers: add_header in a
# location drops the ones inherited from the server block.
server {
  listen ${LISTEN_PORT};
  server_name ${APP_HOST_APP};
  include /etc/nginx/snippets/health.conf;
  root /srv/sp;

  include /etc/nginx/snippets/security-headers.conf;

  # Runtime config of the app host. Not /srv/sp/env.js: that file is the one of the sp host.
  # entrypoint.sh renders this one outside the static export, so the export stays untouched.
  location = /env.js {
    alias /srv/app-env/env.js;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  location /_next/static/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Service worker: always revalidated, allowed to control the whole origin
  location = /sw.js {
    types { }
    default_type application/javascript;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location /icons/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # HTML always revalidates, so the service worker can keep the pages fresh
  location / {
    try_files $uri $uri/ =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;
}
