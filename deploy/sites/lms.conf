# The LMS has its own security headers (snippets/security-headers-lms.conf: video embeds and H5P). Every
# location that sets Cache-Control re-includes them: add_header in a location drops the inherited ones.
server {
  listen ${LISTEN_PORT};
  server_name ${APP_HOST_LMS};
  include /tmp/ihsp/nginx/snippets/health.conf;
  root /srv/lms;

  include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;

  # Invite links are lms.<domain>/join/{code}; the static page /join/ reads the code from ?code=
  rewrite ^/join/([A-Za-z0-9_-]+)/?$ /join/?code=$1 last;

  # The unified course page keeps ids in the path. One static shell answers them and reads window.location; real
  # folders of the export (/course/step/, /course/about/) win, they serve the redirects of the old query links.
  location ~ ^/course/[^/]+(/step/[^/]+|/info)?/?$ {
    try_files $uri/index.html /course/shell/index.html;
  }

  location = /env.js {
    alias /tmp/ihsp/env/lms/env.js;
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "no-store";
  }

  # Installable app (APP_MODE "pwa"): the service worker is always revalidated, the manifest too
  location = /sw.js {
    types { }
    default_type application/javascript;
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "no-cache";
  }

  location /icons/ {
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # H5P packages: files come from the api under a signed path (same origin for the page CSP). The edge nginx
  # of iht-backend routes this prefix to the api itself; this location covers stacks without it.
  location ^~ /v1/lms/h5p/ {
    include /tmp/ihsp/nginx/snippets/proxy-backend.conf;
  }

  # Author-uploaded HTML widgets: same scheme as H5P, but the api sends the widget's own sandbox CSP on every
  # response. The add_header below drops the inherited LMS headers so only that policy applies; the LMS cookies
  # never reach the api from here and no cookie comes back.
  location ^~ /v1/lms/html-widgets/ {
    include /tmp/ihsp/nginx/snippets/proxy-backend.conf;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    add_header X-Robots-Tag "noindex" always;
  }

  # The self-hosted H5P player frame (h5p-standalone, copied by apps/lms/scripts/copy-h5p.mjs)
  location /h5p-player/ {
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # The sandboxed code runner of code blocks (apps/lms/public/code-runner/). Its own CSP replaces the LMS one (the
  # workers come from blob: URLs, which worker-src 'self' forbids); `sandbox allow-scripts` keeps the origin opaque
  # even on a direct visit. runner.html explains each directive.
  location /code-runner/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src blob:; connect-src 'self'; style-src 'none'; img-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache";
  }

  # Pyodide and sql.js (copied by apps/lms/scripts/copy-code-runtimes.mjs), loaded by the runner workers from an
  # opaque origin: public files, so CORS for any origin. Module scripts (.mjs) need a JavaScript MIME type.
  location ~ ^/(pyodide|sqljs)/ {
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    types {
      application/javascript js mjs;
      application/wasm wasm;
      application/json json;
      application/zip zip;
    }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "public, max-age=86400";
  }

  location /_next/static/ {
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
