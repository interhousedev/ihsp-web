# The LMS has its own security headers (snippets/security-headers-lms.conf: video embeds and H5P). Every
# location that sets Cache-Control re-includes them: add_header in a location drops the inherited ones.
server {
  listen ${LISTEN_PORT};
  server_name ${APP_HOST_LMS};
  include /tmp/ihsp/nginx/snippets/health.conf;
  root /srv/lms;

  include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;

  # Invite links are lms.<domain>/join/{code}; the static page /join/ reads the code from ?code=
  rewrite ^/join/([A-Za-z0-9_-]+)/?$ /join/?code=$1 last;

  location = /env.js {
    alias /tmp/ihsp/env/lms/env.js;
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "no-store";
  }

  # Installable app (APP_MODE "pwa"): the service worker is always revalidated, the manifest too
  location = /sw.js {
    types { }
    default_type application/javascript;
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "no-cache";
  }

  location /icons/ {
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # H5P packages: files come from the api under a signed path (same origin for the page CSP). The edge nginx
  # of iht-backend routes this prefix to the api itself; this location covers stacks without it.
  location ^~ /v1/lms/h5p/ {
    include /tmp/ihsp/nginx/snippets/proxy-backend.conf;
  }

  # The self-hosted H5P player frame (h5p-standalone, copied by apps/lms/scripts/copy-h5p.mjs)
  location /h5p-player/ {
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  location /_next/static/ {
    include /tmp/ihsp/nginx/snippets/security-headers-lms.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
