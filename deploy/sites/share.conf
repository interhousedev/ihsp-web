server {
  listen ${LISTEN_PORT};
  server_name ${APP_HOST_SHARE};
  include /etc/nginx/snippets/health.conf;
  include /etc/nginx/snippets/security-headers.conf;

  # Runtime config of the share app (basePath /ai, so the app loads /ai/env.js)
  location = /ai/env.js {
    root /srv/share;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  location /ai/_next/static/ {
    root /srv/share;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Public share viewer: any /ai/* path serves the one static page, the slug is read from the path
  location /ai/ {
    root /srv/share;
    try_files $uri $uri/ /ai/view/index.html;
  }

  # Proxied backend routes (short links, file links)
  location / {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  error_page 404 /404.html;
}
