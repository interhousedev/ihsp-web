# Root domain (ihsu.uz) and www.: the public landing (static export of apps/landing, /srv/landing) owns
# "/" and its own files; room pages (/r/) go to the api; every other path still redirects to my.iht,
# as before the landing existed.
server {
  listen ${LISTEN_PORT};
  server_name ${ROOT_HOST} www.${ROOT_HOST};
  include /tmp/ihsp/nginx/snippets/health.conf;
  root /srv/landing;

  include /tmp/ihsp/nginx/snippets/security-headers.conf;

  # Room pages
  location /r/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location = /env.js {
    alias /tmp/ihsp/env/landing/env.js;
    include /tmp/ihsp/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  location /_next/static/ {
    include /tmp/ihsp/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /screens/ {
    include /tmp/ihsp/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # The landing page itself
  location = / {
    try_files /index.html =404;
  }

  # A file of the export is served; anything else redirects to SP, as before
  location / {
    try_files $uri @sp;
  }

  location @sp {
    return 302 ${IHSP_WEB_SP_URL}/;
  }
}
