server {
  listen ${LISTEN_PORT};
  server_name ${APP_HOST_SP};
  include /tmp/ihsp/nginx/snippets/health.conf;
  root /srv/sp;

  include /tmp/ihsp/nginx/snippets/security-headers.conf;

  location = /env.js {
    alias /tmp/ihsp/env/sp/env.js;
    include /tmp/ihsp/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  location /_next/static/ {
    include /tmp/ihsp/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
