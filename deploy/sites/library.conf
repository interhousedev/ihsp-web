# Library site: the static export of apps/library (/srv/library), routed by Host like the other apps.
# Its public server-rendered pages (/b/, /sitemap.xml, /robots.txt, /opds/) are served by the api
# process; the edge nginx (backend/materials/nginx/common/route-library.inc) sends them there, so
# this server only serves files.
# The library has its own security headers (snippets/security-headers-library.conf: CSP for the
# reader's PDF worker, storage and cover origins). Every location that sets Cache-Control re-includes
# them: add_header in a location drops the ones inherited from the server block.
server {
  listen ${LISTEN_PORT};
  server_name ${APP_HOST_LIBRARY};
  include /tmp/ihsp/nginx/snippets/health.conf;
  root /srv/library;

  include /tmp/ihsp/nginx/snippets/security-headers-library.conf;

  location = /env.js {
    alias /tmp/ihsp/env/library/env.js;
    include /tmp/ihsp/nginx/snippets/security-headers-library.conf;
    add_header Cache-Control "no-store";
  }

  # Installable app (APP_MODE "pwa"): the service worker is always revalidated, the manifest too
  location = /sw.js {
    types { }
    default_type application/javascript;
    include /tmp/ihsp/nginx/snippets/security-headers-library.conf;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    include /tmp/ihsp/nginx/snippets/security-headers-library.conf;
    add_header Cache-Control "no-cache";
  }

  location /icons/ {
    include /tmp/ihsp/nginx/snippets/security-headers-library.conf;
    add_header Cache-Control "public, max-age=86400";
  }

  # nginx's mime.types has no .mjs, and a module worker must be served as JavaScript: this is the
  # PDF.js worker (pdf.worker.min.mjs), whether the build hashes it under /_next/static/ or not.
  location ~ ^/_next/static/.+\.mjs$ {
    types { text/javascript mjs; }
    include /tmp/ihsp/nginx/snippets/security-headers-library.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~ \.mjs$ {
    types { text/javascript mjs; }
    include /tmp/ihsp/nginx/snippets/security-headers-library.conf;
    add_header Cache-Control "no-cache";
  }

  location /_next/static/ {
    include /tmp/ihsp/nginx/snippets/security-headers-library.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Pages are static files and entities travel in the query string (/item/?id=...): every path is
  # a file or a directory index.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
