# api.<domain>: same routing as the edge nginx (backend/materials/nginx/common/route-api.inc).
# Regex locations are tried in order: the first match wins.
server {
  listen ${LISTEN_PORT};
  server_name ${API_HOST};
  include /etc/nginx/snippets/health.conf;

  include /etc/nginx/snippets/security-headers.conf;

  # The EMIS gateway is for the worker and scheduler on the Docker network only.
  location ^~ /internal/ {
    return 404;
  }

  # Composition endpoint that lives in the api process although it sits under /admin/teachers.
  location ~ ^/v1/admin/teachers/[^/]+/profile$ {
    include /etc/nginx/snippets/proxy-backend.conf;
  }

  # Identity owns /v1/id/*, /v1/oauth/* and the admin users, teachers and audit routes.
  location ~ ^/v1/(id|oauth)/ {
    include /etc/nginx/snippets/proxy-identity.conf;
  }

  location ~ ^/v1/admin/(users|teachers|audit)(/|$) {
    include /etc/nginx/snippets/proxy-identity.conf;
  }

  # Telegram bot routes
  location ^~ /telegram/ {
    include /etc/nginx/snippets/proxy-bot.conf;
  }

  # Everything else goes to the api process
  location / {
    include /etc/nginx/snippets/proxy-backend.conf;
  }
}
