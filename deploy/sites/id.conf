server {
  listen ${LISTEN_PORT};
  server_name ${APP_HOST_ID};
  include /tmp/ihsp/nginx/snippets/health.conf;
  root /srv/id;

  include /tmp/ihsp/nginx/snippets/security-headers.conf;

  location = /env.js {
    alias /tmp/ihsp/env/id/env.js;
    include /tmp/ihsp/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  location /_next/static/ {
    include /tmp/ihsp/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Proxy OAuth and Hydra routes to Hydra
  location /oauth2/ {
    include /tmp/ihsp/nginx/snippets/proxy-hydra.conf;
  }

  location /.well-known/ {
    include /tmp/ihsp/nginx/snippets/proxy-hydra.conf;
  }

  location /userinfo {
    include /tmp/ihsp/nginx/snippets/proxy-hydra.conf;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
