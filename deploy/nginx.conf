# Runs as the unprivileged nginx user (uid 101 of nginxinc/nginx-unprivileged): no `user` directive,
# and every path nginx writes to is under /tmp/ihsp. The site configs are rendered there by
# entrypoint.sh at every start (the image's own files stay root-owned and read-only).
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/ihsp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/ihsp/client_body;
  proxy_temp_path /tmp/ihsp/proxy;
  fastcgi_temp_path /tmp/ihsp/fastcgi;
  uwsgi_temp_path /tmp/ihsp/uwsgi;
  scgi_temp_path /tmp/ihsp/scgi;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;

  # gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml application/atom+xml image/svg+xml
             text/x-js text/x-component text/x-cross-domain-policy;

  # No rate limiting here: limits are enforced by the backend (per-IP, behind the edge nginx).

  include /tmp/ihsp/nginx/conf.d/*.conf;
}
