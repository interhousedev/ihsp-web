# Security headers of the library site (template: rendered by entrypoint.sh with envsubst).
# The same headers as security-headers.conf; only the CSP differs (deploy/docker.test.ts checks both):
# - img-src: besides CSP_IMG_SRC, the storage origin (covers and files from presigned URLs) and
#   https://api.unilibrary.uz (covers hot-linked by the UniLibrary feature, off until it is switched on).
# - connect-src: besides CSP_CONNECT_SRC, the storage origin (presigned PDF/EPUB downloads with HTTP Range).
#   (The compose files already put the storage origin into CSP_IMG_SRC and CSP_CONNECT_SRC; listing it here
#   keeps the library working when they don't, and a source listed twice is harmless.)
# - worker-src 'self' blob: the PDF.js worker is self-hosted and may be started from a blob: URL. The
#   per-page <meta> policy of csp-hash.ts carries the same worker-src: a policy without it falls back to
#   script-src, where 'self' does not match blob:.
# - object-src 'none' and no frame-src: the reader never embeds a plugin or a frame.
# Like the other sites, no default-src and no script-src here (see security-headers.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

add_header Content-Security-Policy "style-src 'self' 'unsafe-inline'; img-src ${CSP_IMG_SRC} ${IHSP_STORAGE_ORIGIN} https://api.unilibrary.uz; font-src 'self'; connect-src ${CSP_CONNECT_SRC} ${IHSP_STORAGE_ORIGIN}; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://web.telegram.org" always;
