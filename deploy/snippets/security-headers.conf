# Security headers (template: rendered by entrypoint.sh with envsubst).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP header: everything except scripts.
# - No default-src and no script-src here. Several policies are intersected, and inline scripts fall back
#   to default-src, so either directive in the header would block the inline scripts of the static pages.
#   Scripts are controlled by the per-page <meta> policy that csp-hash.ts inserts after the build
#   (script-src 'self' 'sha256-...' https://telegram.org).
# - connect-src and img-src come from CSP_CONNECT_SRC and CSP_IMG_SRC (local stack: allow http://api.localhost).
add_header Content-Security-Policy "style-src 'self' 'unsafe-inline'; img-src ${CSP_IMG_SRC}; font-src 'self'; connect-src ${CSP_CONNECT_SRC}; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://web.telegram.org" always;
