# Security headers (template: rendered by entrypoint.sh with envsubst).
# No X-Frame-Options: frame-ancestors below is the modern rule and a browser that understands both
# ignores XFO; an XFO SAMEORIGIN would only make the Telegram mini app (framed by web.telegram.org)
# fail in the few engines that know XFO alone.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP header: everything except scripts.
# - No default-src and no script-src here. Several policies are intersected, and inline scripts fall back
#   to default-src, so either directive in the header would block the inline scripts of the static pages.
#   Scripts are controlled by the per-page <meta> policy that csp-hash.ts inserts after the build
#   (script-src 'self' 'sha256-...' https://telegram.org).
# - connect-src and img-src come from CSP_CONNECT_SRC and CSP_IMG_SRC (local stack: allow http://api.localhost).
# - media-src: videos of course materials come from the object store (presigned URLs) or a blob: URL.
# - Every fetch directive that has no default-src to fall back to is listed, otherwise an injected
#   <iframe>, <form action>, <video> or worker would be unrestricted: frame-src 'none' (no page frames
#   anything), form-action 'self' (the apps submit with fetch, never a <form> to another origin),
#   manifest-src and worker-src 'self' (the service worker and the web app manifest are self-hosted).
add_header Content-Security-Policy "style-src 'self' 'unsafe-inline'; img-src ${CSP_IMG_SRC}; font-src 'self'; connect-src ${CSP_CONNECT_SRC}; media-src 'self' blob: ${IHSP_STORAGE_ORIGIN}; frame-src 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://web.telegram.org" always;
