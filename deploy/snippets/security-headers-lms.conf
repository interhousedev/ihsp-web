# Security headers of the LMS site (template: rendered by entrypoint.sh with envsubst).
# The same headers as security-headers.conf; only the CSP differs (deploy/docker.test.ts checks both):
# - frame-src: the YouTube (nocookie) and Vimeo players of video and interactive video blocks. The H5P player
#   frames an about:blank document, which frame-src does not restrict; it inherits this policy.
# - media-src: besides 'self', blob: and the storage origin, https: (an interactive video may be a direct
#   .mp4 link on another site).
# - Scripts, styles, fonts and media of H5P packages are same-origin: /v1/lms/h5p/ is proxied to the api
#   (sites/lms.conf; the edge nginx of iht-backend does the same), and the player frame is self-hosted at
#   /h5p-player/. So script-src stays the per-page <meta> policy of csp-hash.ts ('self' + hashes).
# Like the other sites, no default-src and no script-src here (see security-headers.conf).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

add_header Content-Security-Policy "style-src 'self' 'unsafe-inline'; img-src ${CSP_IMG_SRC}; font-src 'self'; connect-src ${CSP_CONNECT_SRC}; media-src 'self' blob: ${IHSP_STORAGE_ORIGIN} https:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; form-action 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://web.telegram.org" always;
